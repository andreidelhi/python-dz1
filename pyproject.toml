[project]
name = "python-dz1"
version = "0.1.0"
description = "Аналитика каталога стримингового сервиса"
readme = "README.md"
authors = [{ name = "andreidelhi" }]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.17.1"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
